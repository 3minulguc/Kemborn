name: CI

# main'e her push'ta ve her PR'da calisir. Amac: test/CI hic yoktu, bir
# degisiklik "server.js'i 23 dosyaya bolerken export unutuldu" gibi sessiz
# hatalari en azindan kritik is mantigi (para, sifre, stok, arama, e-posta
# dogrulama) icin otomatik yakalasin.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Sunucu — test + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kemborn-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kemborn-server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Lint
        # Sunucu tarafinda lint borcu yok; hata eklenirse CI kirilsin.
        run: npm run lint

  client:
    name: İstemci — test + build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kemborn-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kemborn-client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Lint
        # Lint borcu tamamen kapandi (once ~50 mekanik hata, sonra 14
        # react-hooks, en son 2 react-refresh). Artik SIFIR hata var, bu
        # yuzden continue-on-error kaldirildi: yeni bir lint hatasi
        # eklenirse CI kirilir ve fark edilir.
        run: npm run lint
