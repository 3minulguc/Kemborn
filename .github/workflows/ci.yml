name: CI

# main'e her push'ta ve her PR'da calisir. Amac: test/CI hic yoktu, bir
# degisiklik "server.js'i 23 dosyaya bolerken export unutuldu" gibi sessiz
# hatalari en azindan kritik is mantigi (para, sifre, stok, arama, e-posta
# dogrulama) icin otomatik yakalasin.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Sunucu — test + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kemborn-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kemborn-server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Lint (bilgilendirici — kapatmaz)
        run: npm run lint
        continue-on-error: true

  client:
    name: İstemci — test + build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kemborn-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kemborn-client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Lint (bilgilendirici — kapatmaz)
        # NOT: ~50 mekanik hata (kullanilmayan importlar, yakalanip
        # kullanilmayan hata degiskeni) once temizlendi; ardindan 14
        # react-hooks hatasi 2'ye indirildi.
        #
        # Kalan 2 hata: react-refresh/only-export-components — useCart ve
        # useAuth, Provider'lariyla ayni dosyadan export ediliyor. Sadece
        # gelistirmedeki hot reload'i etkiliyor, calisan siteye etkisi yok.
        # Duzeltmek 16 dosyanin import satirina dokunuyor; ayri ele alinacak.
        #
        # O iki hata da kapaninca buradaki continue-on-error kaldirilmali,
        # boylece lint gercekten zorunlu hale gelir.
        run: npm run lint
        continue-on-error: true
