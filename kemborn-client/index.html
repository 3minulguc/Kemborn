<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- Dosya adları BİLEREK "favicon-*" değil: tarayıcılar favicon'u ayrı
         bir veritabanında, ADRESE göre saklıyor ve ?v=2 gibi sorgu ekleri
         bazen yeterli olmuyor — eski ikon günlerce ekranda kalabiliyor.
         Dosya adının kendisi değişince tarayıcının elinde o adrese ait bir
         kayıt olmuyor, indirmek zorunda kalıyor.
         İkonu ileride değiştirirsen dosya adını da değiştir. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/kemborn-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/kemborn-icon-16.png" />
    <link rel="icon" type="image/x-icon" href="/kemborn-icon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/kemborn-apple-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Sekme başlığı ve Google arama sonucu -->
    <title>Kemborn Intercom</title>
    <meta name="description" content="Kemborn X2 Pro intercom setleri ile motosiklet sürüşlerinde kesintisiz iletişim. Türk patentli, 2 yıl garantili, Bluetooth 5.3 teknolojili intercom kulaklık setleri." />

    <!-- Arama motorlarının siteyi taramasına izin ver -->
    <meta name="robots" content="index, follow" />

    <!-- Instagram / WhatsApp / Facebook paylaşım önizlemesi (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kemborn" />
    <meta property="og:title" content="Kemborn | Türk Patentli Motosiklet İntercom Sistemleri" />
    <meta property="og:description" content="Kemborn X2 Pro intercom setleri ile motosiklet sürüşlerinde kesintisiz iletişim. Türk patentli, 2 yıl garantili, Bluetooth 5.3 teknolojili intercom kulaklık setleri." />
    <meta property="og:image" content="https://kemborn.com/logo.png" />
    <meta property="og:url" content="https://kemborn.com" />
    <meta property="og:locale" content="tr_TR" />

    <!-- Twitter/X paylaşım önizlemesi -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kemborn | Türk Patentli Motosiklet İntercom Sistemleri" />
    <meta name="twitter:description" content="Kemborn X2 Pro intercom setleri ile motosiklet sürüşlerinde kesintisiz iletişim." />
    <meta name="twitter:image" content="https://kemborn.com/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
