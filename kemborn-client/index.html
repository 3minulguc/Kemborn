<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- İkonun ARKA PLANI YOK, sadece harf var. Koyu bir kare kullanıldığında
         Safari sekmede etrafına açık renkli bir çerçeve çiziyordu (koyu ikonu
         koyu sekmeden ayırmak için). Kare olmayınca çizecek bir şey de yok.
         Harf cyan: hem koyu hem açık sekmede okunuyor.

         Dosya adları BİLEREK "favicon-*" değil: tarayıcılar favicon'u ayrı bir
         veritabanında ADRESE göre saklıyor, ?v=2 gibi sorgu ekleri yetmiyor.
         İkonu ileride değiştirirsen DOSYA ADINI da değiştir. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/kemborn-k-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/kemborn-k-16.png" />
    <link rel="icon" type="image/x-icon" href="/kemborn-k.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/kemborn-k-apple.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Sekme başlığı ve Google arama sonucu -->
    <title>Kemborn Intercom</title>
    <meta name="description" content="Kemborn X2 Pro intercom setleri ile motosiklet sürüşlerinde kesintisiz iletişim. Türk patentli, 1 yıl garantili, Bluetooth 5.3 teknolojili intercom kulaklık setleri." />

    <!-- Arama motorlarının siteyi taramasına izin ver -->
    <meta name="robots" content="index, follow" />

    <!-- Instagram / WhatsApp / Facebook paylaşım önizlemesi (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kemborn" />
    <meta property="og:title" content="Kemborn | Türk Patentli Motosiklet İntercom Sistemleri" />
    <meta property="og:description" content="Kemborn X2 Pro intercom setleri ile motosiklet sürüşlerinde kesintisiz iletişim. Türk patentli, 1 yıl garantili, Bluetooth 5.3 teknolojili intercom kulaklık setleri." />
    <meta property="og:image" content="https://kemborn.com/logo.png" />
    <meta property="og:url" content="https://kemborn.com" />
    <meta property="og:locale" content="tr_TR" />

    <!-- Twitter/X paylaşım önizlemesi -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kemborn | Türk Patentli Motosiklet İntercom Sistemleri" />
    <meta name="twitter:description" content="Kemborn X2 Pro intercom setleri ile motosiklet sürüşlerinde kesintisiz iletişim." />
    <meta name="twitter:image" content="https://kemborn.com/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
